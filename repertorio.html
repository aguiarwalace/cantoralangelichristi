<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Repertorio Seleccionado - Angeli Christi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <button onclick="window.location.href='index.html'">← Volver</button>
        <h1>Repertorio Seleccionado</h1>
    </header>

    <main id="repertorio-lista">
        </main>

    <div class="controles-flotantes">
        <button onclick="window.print()">Imprimir / PDF</button>
    </div>

    <script>
        // Lógica simple para mostrar las elegidas
        const datos = [
            { id: 1, titulo: "A TI LEVANTO MIS OJOS", letra: "[Am]A TI LEVANTO MIS [Dm]OJOS..." },
            { id: 2, titulo: "ALABANZAS", letra: "[G]Alabanzas al Se[C]ñor..." },
            { id: 3, titulo: "SEÑOR TEN PIEDAD (I)", letra: "[Em]Señor ten pie[Am]dad..." },
            { id: 4, titulo: "TEN PIEDAD DE MI OH DIOS", letra: "[Am]Ten piedad de [Dm]mí..." }
        ];

        const seleccion = JSON.parse(localStorage.getItem('repertorioActual') || "[]");
        const container = document.getElementById('repertorio-lista');

        seleccion.forEach(id => {
            const song = datos.find(s => s.id === id);
            if(song) {
                const div = document.createElement('div');
                div.className = 'song-page';
                div.innerHTML = `<h2>${song.titulo}</h2><pre>${song.letra}</pre><hr>`;
                container.appendChild(div);
            }
        });
    </script>
</body>
</html>
