<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="img/angeli_christi_logo.ico" type="image/x-icon">
    <title>Cantos por Celebración</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Ajustes de estilo para mantener consistencia */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            background-color: var(--primary, #004488);
            color: white;
            height: 70px;
        }

        .header-left a {
            display: flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
            color: white;
        }

        .selector-container { 
            display: flex; 
            gap: 10px; 
            margin: 30px 0;
            justify-content: center;
            flex-wrap: wrap;
        }

        select { 
            padding: 12px; 
            border-radius: 8px; 
            border: 2px solid #dce4ec; 
            font-size: 16px; 
            min-width: 200px;
            cursor: pointer;
        }

        .misa-titulo { 
            color: #004488; 
            border-bottom: 2px solid #004488; 
            padding-bottom: 10px; 
            margin: 20px 0 20px 0; 
            text-align: center;
            font-size: 1.8rem;
        }

        /* Barra de controles superiores */
        .barra-herramientas {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #eee;
            padding: 10px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        body.dark-mode .barra-herramientas { background: #333; }

        .song-card {
            background: var(--bg-card, #fff);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            position: relative;
        }

        .song-card h3 { color: var(--primary, #004488); margin: 0; }
        
        body.dark-mode { background: #1a1a1a; color: white; }
        body.dark-mode .song-card { background: #2d2d2d; color: white; }
        body.dark-mode .misa-titulo { color: #5dade2; border-color: #5dade2; }

        /* Ocultar elementos al imprimir PDF */
        @media print {
            header, .selector-container, .barra-herramientas, .controles-tono, #btn-volver {
                display: none !important;
            }
            .song-card { box-shadow: none; border: 1px solid #eee; page-break-after: always; }
            body { background: white; color: black; }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <a href="index.html">
                <img src="img/angeli_christi_logo_blc.png" alt="Logo" style="height: 40px;">
                <h1>Cantos por Celebración</h1>
            </a>
        </div>
        <button onclick="toggleDarkMode()" style="background:none; border:none; color:white; font-size:1.5rem; cursor:pointer;">🌓</button>
    </header>

    <main id="main-content" style="max-width: 800px; margin: 0 auto; padding: 20px;">
        
        <div id="zona-seleccion" class="selector-container">
            <select id="select-ciclo" onchange="cargarCelebraciones()">
                <option value="">Año / Ciclo...</option>
                <option value="Ciclo A">Año A</option>
                <option value="Ciclo B">Año B</option>
                <option value="Ciclo C">Año C</option>
                <option value="Solemnidades">Solemnidades</option>
                <option value="Eventos">Eventos</option>
            </select>

            <select id="select-misa" onchange="mostrarMisa()" disabled>
                <option value="">Celebración...</option>
            </select>
        </div>

        <div id="contenedor-misa">
            </div>

        <div id="btn-volver-container" style="text-align: center; margin-top: 20px; display: none;">
            <button onclick="location.reload()" class="btn-primary" style="width: auto; padding: 10px 30px;">Nueva Búsqueda</button>
        </div>
    </main>

    <script src="lista_canciones.js"></script>
    <script src="calendario.js"></script>
    <script src="script.js"></script> 
    
<script>
        let fontSizeGlobal = 1.2;

        // Lógica de Teoría Musical (Aislada para evitar errores)
        const escalaSostenidosLocal = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        const escalaBemolesLocal = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];
        const tonosConBemolesLocal = ['F', 'Bb', 'Eb', 'Ab', 'Db', 'Gb', 'Dm', 'Gm', 'Cm', 'Fm', 'Bbm', 'Ebm'];

        function cargarCelebraciones() {
            const ciclo = document.getElementById('select-ciclo').value;
            const selectMisa = document.getElementById('select-misa');
            selectMisa.innerHTML = '<option value="">Celebración...</option>';
            
            if (ciclo && datosLiturgicos[ciclo]) {
                datosLiturgicos[ciclo].forEach(misa => {
                    let opt = document.createElement('option');
                    opt.value = misa.id;
                    opt.textContent = misa.nombre;
                    selectMisa.appendChild(opt);
                });
                selectMisa.disabled = false;
            } else {
                selectMisa.disabled = true;
            }
        }

        function cambiarTextoGlobal(delta) {
            fontSizeGlobal += delta;
            if (fontSizeGlobal < 0.8) fontSizeGlobal = 0.8;
            if (fontSizeGlobal > 2.5) fontSizeGlobal = 2.5;
            
            document.querySelectorAll('.lyrics-container').forEach(el => {
                el.style.fontSize = fontSizeGlobal + 'rem';
            });
        }

        function mostrarMisa() {
            const ciclo = document.getElementById('select-ciclo').value;
            const misaId = document.getElementById('select-misa').value;
            const contenedor = document.getElementById('contenedor-misa');
            const zonaSeleccion = document.getElementById('zona-seleccion');
            const btnVolver = document.getElementById('btn-volver-container');
            
            if (!misaId) return;

            const misa = datosLiturgicos[ciclo].find(m => m.id === misaId);
            if (!misa) return;

            zonaSeleccion.style.display = 'none';
            btnVolver.style.display = 'block';

            contenedor.innerHTML = `
                <h2 class="misa-titulo">${misa.nombre}</h2>
                <div class="barra-herramientas">
                    <div class="controles-tono">
                        <button onclick="cambiarTextoGlobal(-0.1)">A-</button>
                        <button onclick="cambiarTextoGlobal(0.1)">A+</button>
                        <span style="font-size:0.8rem; margin-left:10px;">Texto</span>
                    </div>
                    <button onclick="window.print()" class="btn-primary" style="width:auto; padding: 5px 15px;">Generar PDF</button>
                </div>
            `;

            misa.cantos.forEach(id => {
                const song = canciones.find(s => s.id === id);
                if (song) {
                    const escalaInicial = tonosConBemolesLocal.includes(song.tonoOriginal) ? escalaBemolesLocal : escalaSostenidosLocal;

                    const card = document.createElement('div');
                    card.className = 'song-card';
                    card.innerHTML = `
                        <div style="margin-bottom:15px; border-bottom:1px solid #eee; padding-bottom:10px;">
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <h3 style="margin:0;">${song.titulo}</h3>
                                <div class="controles-tono">
                                    <button onclick="cambiarTonoLocal(${song.id}, -1)">-</button>
                                    <button onclick="cambiarTonoLocal(${song.id}, 0)">⟳</button>
                                    <button onclick="cambiarTonoLocal(${song.id}, 1)">+</button>
                                </div>
                            </div>
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-top: 8px; font-size: 0.9rem; opacity: 0.8;">
                                <span style="font-style: italic;">Autor: ${song.autor || 'Desconocido'}</span>
                                <span style="background: rgba(128,128,128,0.15); padding: 3px 8px; border-radius: 5px; font-weight: bold;">
                                    Tono: <span id="tono-label-${song.id}">${song.tonoOriginal}</span>
                                </span>
                            </div>
                        </div>
                        <div id="song-body-${song.id}" class="lyrics-container" data-offset="0" style="font-size: ${fontSizeGlobal}rem">
                            ${formatearAcordesEnLetra(song.letra, 0, escalaInicial, song.tonoOriginal)}
                        </div>
                    `;
                    contenedor.appendChild(card);
                }
            });
            window.scrollTo(0, 0);
        }

        function cambiarTonoLocal(id, delta) {
            const song = canciones.find(s => s.id === id);
            const container = document.getElementById(`song-body-${id}`);
            if (!song || !container) return;

            let offset = parseInt(container.getAttribute('data-offset'));
            offset = (delta === 0) ? 0 : offset + delta;
            container.setAttribute('data-offset', offset);

            const nuevoTono = calcularNombreTono(song.tonoOriginal, offset);
            const escala = tonosConBemolesLocal.includes(nuevoTono) ? escalaBemolesLocal : escalaSostenidosLocal;

            container.innerHTML = formatearAcordesEnLetra(song.letra, offset, escala, nuevoTono);

            // NUEVA SECCIÓN: Actualiza el indicador visual de Tono
            const labelTono = document.getElementById(`tono-label-${id}`);
            if (labelTono) {
                labelTono.textContent = nuevoTono;
            }
        }
    </script>
</body>
</html>
