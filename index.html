<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cantoral Online Angeli Christi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-left">
            <a href="index.html" style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 15px;">
                <img src="angeli_christi_logo_blc.png" alt="Logo" class="logo-mini">
                <h1>Cantoral Angeli Christi</h1>
            </a>
        </div>
        <button id="menu-btn" onclick="toggleMenu()">☰</button>
    </header>

    <main id="main-content">
        <div id="welcome-screen" class="center" style="display: flex; flex-direction: column; align-items: center; text-align: center; padding: 50px 20px;">
            <img src="angeli_christi_logo.png" alt="Logo Grande" class="logo-large">
            <p class="coro-lema" style="font-style: italic; margin-top: 20px;">¿Quién como Dios? ¡Nadie como Dios!</p>
            <p>Abre el menú para buscar canciones y armar tu repertorio.</p>
        </div>
        
        <div id="song-display"></div>
    </main>

    <nav id="sidebar">
        <div class="sidebar-header">
            <h3>Menú</h3>
            <button onclick="toggleMenu()">✕</button>
        </div>
        
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Título o frase de la letra..." onkeyup="filterSongs()">
        </div>

        <div class="filter-box">
            <select id="category-filter" onchange="filterSongs()">
                <option value="todos">Todos los apartados</option>
                <option value="entrada">Entrada</option>
                <option value="piedad">Piedad</option>
                <option value="ofertorio">Ofertorio</option>
                <option value="santo">Santo</option>
                <option value="cordero">Cordero</option>
                <option value="comunion">Comunión</option>
                <option value="marianos">Marianos</option>
                <option value="alabanza">Alabanza</option>
            </select>
        </div>

        <div id="song-list-container">
            </div>

        <div class="sidebar-footer">
            <button id="gen-repertorio-btn" onclick="generateRepertoire()">Generar Repertorio</button>
            <button class="btn-secondary" onclick="toggleDarkMode()">🌓 Cambiar Tema</button>
        </div>
    </nav>

    <script src="lista_canciones.js"></script>
    <script src="script.js"></script>
</body>
</html>
