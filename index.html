<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cantoral Online Angeli Christi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-left">
            <img src="angeli_christi_logo_blc.png" alt="Logo" class="logo-mini">
            <h1>Cantoral Online Angeli Christi</h1>
        </div>
        <button id="menu-btn" onclick="toggleMenu()">☰</button>
    </header>

    <main id="main-content">
        <div id="welcome-screen" class="center">
            <img src="angeli_christi_logo.png" alt="Logo Grande" class="logo-large">
            <p class="coro-lema">¿Quién como Dios? ¡Nadie como Dios!</p>
            
            <p>Abre el menú para buscar canciones y armar tu repertorio.</p>
        </div>
        
        <div id="song-display"></div>
    </main>

    <nav id="sidebar">
        <div class="sidebar-header">
            <h3>Menú</h3>
            <button onclick="toggleMenu()">✕</button>
        </div>
        
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Buscar por título o letra..." onkeyup="filterSongs()">
        </div>

        <select id="category-filter" onchange="filterSongs()">
            <option value="todos">Todos los apartados</option>
            <option value="entrada">Entrada</option>
            <option value="piedad">Piedad</option>
            <option value="ofertorio">Ofertorio</option>
            <option value="santo">Santo</option>
            <option value="cordero">Cordero</option>
        </select>

        <div id="song-list-container">
            </div>

        <button id="gen-repertorio-btn" onclick="generateRepertoire()">Generar Repertorio</button>
        <button onclick="toggleDarkMode()">Modo Oscuro/Claro</button>
    </nav>

    <script src="script.js"></script>
</body>
</html>
