<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="img/angeli_christi_logo.ico" type="image/x-icon">
    <title>Cantoral Online Angeli Christi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-left">
            <a href="index.html" style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 15px;">
                <img src="img/angeli_christi_logo_blc.png" alt="Logo" class="logo-mini">
                <h1>Cantoral Angeli Christi</h1>
            </a>
        </div>
        <button id="menu-btn" onclick="toggleMenu()">☰</button>
        <button id="menu-btn" onclick="window.location.href='celebraciones.html'" >📅</button>
    </header>

    <main id="main-content">
        <div id="welcome-screen" class="center" style="display: flex; flex-direction: column; align-items: center; text-align: center; padding: 50px 20px;">
            <img src="img/angeli_christi_logo.png" alt="Logo Grande" class="logo-large">
            <p class="coro-lema" style="font-style: italic; margin-top: 20px;">¿Quién como Dios? ¡Nadie como Dios!</p>
            <p>Abre el menú para buscar canciones y armar tu repertorio.</p>
        </div>
        <div id="links-cantoral">
            <p><a href="https://drive.google.com/file/d/1JOed7rWY1Z5teke4MkoTM_XlD02eKipz/view" target="_blank">Cantoral 2014</a></p>
            <p><a href="https://drive.google.com/file/d/19IIiFJIrRiLCUJafd9kcmC7axcjZ9Aa5/view" target="_blank">Cantoral 2024</a></p>
        </div>
        
        <div id="song-display"></div>
    </main>

    <nav id="sidebar">
        <div class="sidebar-header">
            <h3>Menú</h3>
            <button onclick="toggleMenu()">✕</button>
        </div>
        
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Título o frase de la letra..." onkeyup="filterSongs()">
        </div>

        <div class="filter-box">
            <select id="category-filter" onchange="filterSongs()">
                <option value="todos">Todos los apartados</option>
                <option value="entrada">Entrada</option>
                <option value="piedad">Piedad</option>
                <option value="aspersion">Aspersión</option>
                <option value="gloria">Gloria</option>
                <option value="aleluya">Aleluya</option>
                <option value="ofrendas">Ofrendas</option>
                <option value="ofertorio">Ofertorio</option>
                <option value="santo">Santo</option>
                <option value="doxologia">Doxología</option>
                <option value="padrenuestro">Padre Nuestro</option>
                <option value="cordero">Cordero</option>
                <option value="comunion">Comunión</option>
                <option value="reflexion">Reflexión</option>
                <option value="salida">Salida</option>
                <option value="adoracion">Adoración</option>
                <option value="espiritusanto">Espíritu Santo</option>
                <option value="marianos">Marianos</option>
                <option value="navidad">Navidad</option>
                <option value="alabanza">Alabanza</option>
                <option value="pasion">La Pasión</option>
                <option value="angelichristi">Angeli Christi</option>
            </select>
        </div>

        <button class="btn-clear" onclick="clearSearch()" style="width: 100%; margin-bottom: 10px; background: #eee; color: #333; border: 1px solid #ccc; padding: 5px; cursor: pointer; border-radius: 4px;">
    🧹 Limpiar búsqueda
</button>

        
        <div id="song-list-container" style="max-height: 60vh; overflow-y: auto; margin-bottom: 15px;">
        </div>

    <div class="sidebar-footer" style="display: flex; flex-direction: column; gap: 10px;">
        <button id="gen-repertorio-btn" onclick="generateRepertoire()" style="background: var(--accent); color: white; padding: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">
            📊 Generar Repertorio
        </button>
        
        <button onclick="toggleDarkMode()" style="background: #444; color: white; padding: 10px; border: none; border-radius: 5px; cursor: pointer;">
            🌓 Modo Oscuro/Claro
        </button>
    </div>

    <script src="lista_canciones.js"></script>
    <script src="script.js"></script>
</body>
</html>
