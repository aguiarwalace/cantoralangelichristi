<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="img/angeli_christi_logo.ico" type="image/x-icon">
    <title>Colaborar - Angeli Christi</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #f4f6f9;
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        *, *::before, *::after {
            box-sizing: inherit;
        }
        .admin-container {
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
        }
        .form-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }
        .import-card {
            background: #e0f2fe;
            border: 2px solid #38bdf8;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
        }
        h2, h3 {
            color: #004488;
            margin-top: 0;
        }
        h2 {
            border-bottom: 2px solid #004488;
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .form-row-double {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        .form-row-double .form-group {
            flex: 1;
            margin-bottom: 0;
        }
        .form-group-row {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 12px;
            background: #f8fafc;
            padding: 12px;
            border-radius: 8px;
            border: 1px dashed #004488;
            margin-bottom: 20px;
        }
        label {
            font-weight: bold;
            color: #333;
        }
        input[type="text"], input[type="url"], select, textarea {
            padding: 10px;
            border: 2px solid #dce4ec;
            border-radius: 6px;
            font-size: 16px;
            width: 100%;
        }
        textarea {
            resize: vertical;
            font-family: monospace;
        }

        /* Categorías */
        .categories-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 5px;
        }
        .category-pill {
            cursor: pointer;
            display: inline-block;
        }
        .category-pill input {
            display: none;
        }
        .category-pill span {
            display: inline-block;
            padding: 8px 14px;
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #475569;
            font-weight: 500;
            transition: all 0.2s ease;
            user-select: none;
        }
        .category-pill:hover span {
            background: #e2e8f0;
        }
        .category-pill input:checked + span {
            background: #004488;
            color: white;
            border-color: #004488;
            box-shadow: 0 2px 6px rgba(0, 68, 136, 0.3);
        }

        /* Botones */
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .btn-success {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            flex: 1;
        }
        .btn-success:hover { background-color: #219150; }
        .btn-primary {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-primary:hover { background-color: #0369a1; }
        
        .output-card {
            background: #2d3748;
            color: #a0aec0;
            padding: 20px;
            border-radius: 8px;
            margin-top: 30px;
            display: none;
        }
        .output-card h3 { color: #fff; margin-top: 0; }
        pre {
            background: #1a202c;
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
            color: #38bdf8;
            font-family: monospace;
            white-space: pre-wrap;
        }

        @media (max-width: 500px) {
            .form-row-double {
                flex-direction: column;
                gap: 20px;
            }
        }
    </style>
</head>
<body>
    <header style="background-color: #004488; color: white; padding: 15px 20px; text-align: center;">
        <h1>Creador de Cantos Colaborativo</h1>
    </header>

    <main class="admin-container">
        
        <!-- IMPORTADOR -->
        <div class="import-card">
            <h3>⚡ Importador Rápido</h3>
            <p style="color: #0369a1; font-size: 0.9rem; margin-top: 0;">Insira um link do LaCuerda ou CifraClub para tentar preencher os dados automaticamente.</p>
            <div style="display: flex; gap: 10px;">
                <input type="url" id="link-importar" placeholder="Ej: https://lacuerda.net/char/cancion_ejemplo">
                <button class="btn-primary" id="btn-importar" onclick="importarDesdeEnlace()">Importar</button>
            </div>
        </div>

        <div class="form-card">
            <h2>Agregar Nuevo Canto</h2>
            
            <div class="form-group">
                <label for="titulo">Título del Canto:</label>
                <input type="text" id="titulo" placeholder="Ej. Pescador de Hombres" required>
            </div>

            <div class="form-group">
                <label for="autor">Autor / Ministerio:</label>
                <input type="text" id="autor" placeholder="Ej. Cesáreo Gabaráin (o Tradicional)" required>
            </div>

            <!-- Categorías -->
            <div class="form-group">
                <label>Categorías (Selecciona todas las que apliquen):</label>
                <div class="categories-grid">
                    <label class="category-pill"><input type="checkbox" name="categorias" value="entrada"><span>Entrada</span></label>
                    <label class="category-pill"><input type="checkbox" name="categorias" value="piedad"><span>Piedad</span></label>
                    <label class="category-pill"><input type="checkbox" name="categorias" value="aspersion"><span>Aspersión</span></label>
                    <label class="category-pill"><input type="checkbox" name="categorias" value="gloria"><span>Gloria</span></label>
                    <label class="category-pill"><input type="checkbox" name="categorias" value="aleluya"><span>Aleluya</span></label>
                    <label class="category-pill"><input type="checkbox" name="categorias" value="ofrendas"><span>Ofrendas</span></label>
                    <label class="category-pill"><input type="checkbox" name="categorias" value="ofertorio"><span>Ofertorio</span></label>
                    <label class="category-pill"><input type="checkbox" name="categorias" value="santo"><span>Santo</span></label>
                    <label class="category-pill"><input type="checkbox" name="categorias" value="doxologia"><span>Doxología</span></label>
                    <label class="category-pill"><input type="checkbox" name="categorias" value="padrenuestro"><span>Padre Nuestro</span></label>
                    <label class="category-pill"><input type="checkbox" name="categorias" value="cordero"><span>Cordero</span></label>
                    <label class="category-pill"><input type="checkbox" name="categorias" value="comunion"><span>Comunión</span></label>
                    <label class="category-pill"><input type="checkbox" name="categorias" value="reflexion"><span>Reflexión</span></label>
                    <label class="category-pill"><input type="checkbox" name="categorias" value="salida"><span>Salida</span></label>
                    <label class="category-pill"><input type="checkbox" name="categorias" value="adoracion"><span>Adoración</span></label>
                    <label class="category-pill"><input type="checkbox" name="categorias" value="espiritusanto"><span>Espíritu Santo</span></label>
                    <label class="category-pill"><input type="checkbox" name="categorias" value="mariano"><span>Mariano</span></label>
                    <label class="category-pill"><input type="checkbox" name="categorias" value="navidad"><span>Navidad</span></label>
                    <label class="category-pill"><input type="checkbox" name="categorias" value="alabanza"><span>Alabanza</span></label>
                    <label class="category-pill"><input type="checkbox" name="categorias" value="pasion"><span>Pasión</span></label>
                    <label class="category-pill"><input type="checkbox" name="categorias" value="angelichristi"><span>Angeli Christi</span></label>
                </div>
            </div>

            <!-- Tono y Capo -->
            <div class="form-row-double">
                <div class="form-group">
                    <label for="tono">Tono Original:</label>
                    <select id="tono">
                        <option value="C">Do (C)</option>
                        <option value="Db">Reb (Db)</option>
                        <option value="D">Re (D)</option>
                        <option value="Eb">Mib (Eb)</option>
                        <option value="E">Mi (E)</option>
                        <option value="F">Fa (F)</option>
                        <option value="F#">Fa# (F#)</option>
                        <option value="G">Sol (G)</option>
                        <option value="Ab">Lab (Ab)</option>
                        <option value="A">La (A)</option>
                        <option value="Bb">Sib (Bb)</option>
                        <option value="B">Si (B)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="capo">Capo (Cejilla):</label>
                    <select id="capo">
                        <option value="0">Sin Capo</option>
                        <option value="1">Capo 1</option>
                        <option value="2">Capo 2</option>
                        <option value="3">Capo 3</option>
                        <option value="4">Capo 4</option>
                        <option value="5">Capo 5</option>
                        <option value="6">Capo 6</option>
                        <option value="7">Capo 7</option>
                    </select>
                </div>
            </div>

            <!-- Links Opcionales -->
            <div class="form-row-double">
                <div class="form-group">
                    <label for="linkYoutube">Link de YouTube (Opcional):</label>
                    <input type="url" id="linkYoutube" placeholder="https://www.youtube.com/watch?v=...">
                </div>
                <div class="form-group">
                    <label for="linkPartitura">Link de Partitura/Drive (Opcional):</label>
                    <input type="url" id="linkPartitura" placeholder="https://drive.google.com/file/d/...">
                </div>
            </div>

            <!-- Checkbox Alineación -->
            <div class="form-group-row">
                <input type="checkbox" id="acordes-arriba" style="width: auto; transform: scale(1.3); cursor: pointer;">
                <label for="acordes-arriba" style="margin: 0; cursor: pointer; font-size: 0.95rem; color: #004488;">
                    Pegar con acordes en la línea de arriba (ej. LaCuerda / CifraClub)
                </label>
            </div>

            <div class="form-group">
                <label for="letra">Letra del Canto:</label>
                <textarea id="letra" rows="12" placeholder="Pega aquí la letra..." required></textarea>
            </div>

            <div class="btn-group">
                <button class="btn-success" onclick="generarCodigoCanto()">Generar Canto ✨</button>
            </div>
        </div>

        <!-- Salida -->
        <div id="output-area" class="output-card">
            <h3>¡Canto Procesado con Éxito!</h3>
            <p style="color: #cbd5e0; font-size: 0.9rem;">Pídele al administrador que copie este bloque de código y lo pegue dentro de su archivo <code>lista_canciones.js</code>.</p>
            
            <pre id="codigo-resultado"></pre>
            
            <div class="btn-group">
                <button class="btn-success" style="background-color: #3182ce;" onclick="copiarCodigo()">📋 Copiar Código</button>
                <button class="btn-success" style="background-color: #25d366;" id="btn-whatsapp" onclick="enviarPorWhatsApp()">💬 Enviar al Administrador</button>
            </div>
        </div>
    </main>

    <script>
        const TELEFONO_ADMINISTRADOR = "5219999944550"; 
        let bloqueCodigoGenerado = "";

        // FUNÇÃO DE IMPORTAÇÃO OTIMIZADA
        async function importarDesdeEnlace() {
            const url = document.getElementById('link-importar').value.trim();
            const btn = document.getElementById('btn-importar');

            if (!url) {
                alert("Por favor, ingresa un enlace de LaCuerda o CifraClub.");
                return;
            }

            btn.textContent = "Cargando... ⏳";
            btn.disabled = true;

            try {
                // Proxy AllOrigins para contornar o CORS
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
                const response = await fetch(proxyUrl);
                
                if (!response.ok) throw new Error("No se pudo conectar al servidor proxy.");
                
                const data = await response.json();
                const htmlText = data.contents;

                // Verificação de segurança da Cloudflare
                if (htmlText.includes("cloudflare") || htmlText.includes("Cloudflare") || htmlText.includes("Attention Required")) {
                    throw new Error("El sitio web de origen bloqueó la importación automática por seguridad (Cloudflare).");
                }

                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, "text/html");

                let titulo = "";
                let autor = "";
                let letraConAcordes = "";

                // Parsing flexível para LaCuerda (inclui acordes.lacuerda.net)
                if (url.includes("lacuerda.net")) {
                    const h1Element = doc.querySelector("h1") || doc.querySelector("#cx_title") || doc.querySelector("title");
                    const h2Element = doc.querySelector("h2") || doc.querySelector("#cx_artist") || doc.querySelector(".artist");
                    const preElement = doc.querySelector("#cuerpo") || doc.querySelector("pre");

                    titulo = h1Element ? h1Element.textContent.replace(/Acordes de/i, "").replace(/\(.*?\)/g, "").trim() : "";
                    autor = h2Element ? h2Element.textContent.trim() : "";
                    letraConAcordes = preElement ? preElement.textContent : "";

                // Parsing flexível para CifraClub
                } else if (url.includes("cifraclub.com")) {
                    const h1Element = doc.querySelector(".t1") || doc.querySelector(".t3") || doc.querySelector("h1") || doc.querySelector("title");
                    const artistElement = doc.querySelector(".cifra-artist") || doc.querySelector("h2") || doc.querySelector(".artist-name");
                    const preElement = doc.querySelector(".cifra_body pre") || doc.querySelector("pre") || doc.querySelector(".cifra-container");

                    titulo = h1Element ? h1Element.textContent.replace(/Cifra Club/i, "").replace(/-\s*Reik/i, "").trim() : "";
                    autor = artistElement ? artistElement.textContent.trim() : "";
                    letraConAcordes = preElement ? preElement.textContent : "";
                } else {
                    throw new Error("Por ahora solo se soportan enlaces de lacuerda.net o cifraclub.com.");
                }

                // Se o HTML veio vazio ou sem letra detetada
                if (!letraConAcordes || letraConAcordes.trim() === "") {
                    throw new Error("No se pudo extraer el texto de la canción. El sitio web de origen puede estar bloqueando la solicitud.");
                }

                // Atualizar o formulário
                document.getElementById('titulo').value = titulo;
                document.getElementById('autor').value = autor;
                document.getElementById('letra').value = letraConAcordes;
                document.getElementById('acordes-arriba').checked = true;

                alert("¡Datos importados con éxito! Por favor revisa que todo esté correcto.");

            } catch (error) {
                console.error("Error al importar:", error);
                
                // Mensagem amigável explicando o bloqueio e oferecendo o plano de contingência
                alert(`No se pudo importar automáticamente debido a: \n"${error.message}"\n\n💡 SOLUCIÓN:\n1. Abre el enlace en tu navegador.\n2. Copia la letra con los acordes manualmente.\n3. Pégala directamente en el cuadro de texto abajo.\n4. Asegúrate de activar la casilla "Pegar con acordes en la línea de arriba".\n¡El programa hará el formato automáticamente!`);
            } finally {
                btn.textContent = "Importar";
                btn.disabled = false;
            }
        }

        // Conversor automático de acordes superiores
        function procesarAcordesSuperiores(textoOriginal) {
            const lineas = textoOriginal.split('\n');
            const lineasProcesadas = [];
            const patronAcorde = /^[A-G][b#]?(m|maj|min|sus|dim|aug|add|alt|\d)*(\([^)]+\))?(\/[A-G][b#]?(m)?)?$/i;
            
            function esLineaDeAcordes(linea) {
                const l = linea.trim();
                if (!l) return false;
                const palabras = l.split(/\s+/);
                return palabras.every(palabra => patronAcorde.test(palabra));
            }
            
            for (let i = 0; i < lineas.length; i++) {
                const lineaActual = lineas[i];
                
                if (esLineaDeAcordes(lineaActual)) {
                    const lineaSiguiente = lineas[i + 1];
                    
                    if (lineaSiguiente !== undefined && !esLineaDeAcordes(lineaSiguiente) && lineaSiguiente.trim() !== "") {
                        const acordesEncontrados = [];
                        let indiceBusqueda = 0;
                        const palabrasDeAcordes = lineaActual.match(/\S+/g) || [];
                        
                        palabrasDeAcordes.forEach(acorde => {
                            const posicionChar = lineaActual.indexOf(acorde, indiceBusqueda);
                            acordesEncontrados.push({ acorde, posicion: posicionChar });
                            indiceBusqueda = posicionChar + acorde.length;
                        });
                        
                        acordesEncontrados.sort((a, b) => b.posicion - a.posicion);
                        
                        let letraConAcordes = lineaSiguiente;
                        
                        acordesEncontrados.forEach(item => {
                            const pos = item.posicion;
                            const bloqueAcorde = `[${item.acorde}]`;
                            
                            if (pos >= letraConAcordes.length) {
                                letraConAcordes = letraConAcordes.padEnd(pos) + bloqueAcorde;
                            } else {
                                letraConAcordes = letraConAcordes.slice(0, pos) + bloqueAcorde + letraConAcordes.slice(pos);
                            }
                        });
                        
                        lineasProcesadas.push(letraConAcordes);
                        i++; 
                    } else {
                        const acordesSolos = lineaActual.split(/\s+/).filter(a => a.trim() !== "");
                        const introFormateada = acordesSolos.map(a => `[${a}]`).join(' ');
                        lineasProcesadas.push(introFormateada);
                    }
                } else {
                    lineasProcesadas.push(lineaActual);
                }
            }
            return lineasProcesadas.join('\n');
        }

        function generarCodigoCanto() {
            const tituloVal = document.getElementById('titulo').value.trim();
            const autorVal = document.getElementById('autor').value.trim();
            const tonoVal = document.getElementById('tono').value;
            const capoVal = document.getElementById('capo').value;
            let letraVal = document.getElementById('letra').value;

            const linkYoutubeVal = document.getElementById('linkYoutube').value.trim();
            const linkPartituraVal = document.getElementById('linkPartitura').value.trim();

            if (!tituloVal || !autorVal || !letraVal.trim()) {
                alert("Por favor, rellena todos los campos antes de generar el canto.");
                return;
            }

            const checkboxes = document.querySelectorAll('input[name="categorias"]:checked');
            const listaCategorias = [];
            checkboxes.forEach(cb => {
                listaCategorias.push(cb.value);
            });
            const categoriasSeleccionadas = listaCategorias.join(", ");

            let tonoFinal = tonoVal;
            if (capoVal !== "0") {
                tonoFinal += ` (capo ${capoVal})`;
            }

            const usarAcordesArriba = document.getElementById('acordes-arriba').checked;
            if (usarAcordesArriba) {
                letraVal = procesarAcordesSuperiores(letraVal);
            } else {
                letraVal = letraVal.trim();
            }

            const nuevoId = Date.now();

            let lineasOpcionales = "";
            if (linkYoutubeVal !== "") {
                lineasOpcionales += `\n  linkYoutube: "${linkYoutubeVal}",`;
            }
            if (linkPartituraVal !== "") {
                lineasOpcionales += `\n  linkPartitura: "${linkPartituraVal}",`;
            }

            bloqueCodigoGenerado = `{\n  id: ${nuevoId},\n  titulo: "${tituloVal}",\n  autor: "${autorVal}",\n  categoria: "${categoriasSeleccionadas}",\n  tonoOriginal: "${tonoFinal}",${lineasOpcionales}\n  letra: \`${letraVal}\`\n},`;

            document.getElementById('codigo-resultado').textContent = bloqueCodigoGenerado;
            document.getElementById('output-area').style.display = "block";
            document.getElementById('output-area').scrollIntoView({ behavior: 'smooth' });
        }

        function copiarCodigo() {
            navigator.clipboard.writeText(bloqueCodigoGenerado);
            alert("¡Código copiado al portapapeles!");
        }

        function enviarPorWhatsApp() {
            const tituloVal = document.getElementById('titulo').value.trim();
            const mensaje = `¡Hola! Aquí tienes un nuevo canto para el repertorio de Angeli Christi:\n\n*${tituloVal}*\n\n\`\`\`${bloqueCodigoGenerado}\`\`\``;
            const mensajeCodificado = encodeURIComponent(mensaje);
            window.open(`https://wa.me/${TELEFONO_ADMINISTRADOR}?text=${mensajeCodificado}`, '_blank');
        }
    </script>
</body>
</html>
